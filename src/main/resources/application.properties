spring.application.name=med-super-app-backend

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET}
app.patient-data.aes-key=${PATIENT_DATA_AES_KEY}
app.patient-data.lookup-hmac-key=${PATIENT_LOOKUP_HMAC_KEY}
app.patient-data.migrate-legacy-on-startup=${PATIENT_DATA_MIGRATE_LEGACY_ON_STARTUP:false}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.firebase.project-id=${FIREBASE_PROJECT_ID:medappsms}
app.sms-gateway.registration-key=${SMS_GATEWAY_REGISTRATION_KEY:}
app.sms-gateway.direct-fcm-token=${SMS_GATEWAY_DIRECT_FCM_TOKEN:}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.password-reset.token-expiration-minutes=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}
app.auth.max-failed-login-attempts=${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
app.audit.mongodb.database=${AUDIT_MONGODB_DATABASE:audit_logs}
app.audit.instance-id-file=${AUDIT_INSTANCE_ID_FILE:.backend-instance-id}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.bootstrap.admin.phone-number=${BOOTSTRAP_ADMIN_PHONE_NUMBER:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
